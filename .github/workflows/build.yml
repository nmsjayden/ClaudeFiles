name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Build archive (unsigned)
        run: |
          xcodebuild archive \
            -scheme ClaudeFiles \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/ClaudeFiles.xcarchive" \
            -destination "generic/platform=iOS" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Debug archive contents
        run: |
          echo "=== Archive structure ==="
          find "$RUNNER_TEMP/ClaudeFiles.xcarchive" -maxdepth 4 | head -30

      - name: Package IPA
        run: |
          # Find the .app — location varies with signing settings
          APP_PATH=$(find "$RUNNER_TEMP/ClaudeFiles.xcarchive" -name "*.app" -maxdepth 6 | head -1)
          echo "Found app at: $APP_PATH"

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No .app found in archive"
            exit 1
          fi

          PAYLOAD_DIR="$RUNNER_TEMP/Payload"
          mkdir -p "$PAYLOAD_DIR"
          cp -r "$APP_PATH" "$PAYLOAD_DIR/"

          IPA_PATH="$RUNNER_TEMP/ClaudeFiles-unsigned.ipa"
          cd "$RUNNER_TEMP"
          zip -r "$IPA_PATH" Payload/

          echo "IPA size: $(du -sh "$IPA_PATH" | cut -f1)"
          echo "IPA_PATH=$IPA_PATH" >> $GITHUB_ENV

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClaudeFiles-unsigned
          path: ${{ env.IPA_PATH }}
          retention-days: 30
