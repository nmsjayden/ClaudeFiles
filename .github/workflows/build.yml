name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16.1
        run: |
          # Xcode 16.4 has an unfixable SwiftUICore linker bug.
          # 16.1 doesn't ship SwiftUICore as a separate framework.
          for v in 16.1 16.0; do
            APP="/Applications/Xcode_${v}.app"
            if [ -d "$APP" ]; then
              sudo xcode-select -s "$APP/Contents/Developer"
              echo "Selected Xcode $v"
              break
            fi
          done
          xcodebuild -version

      - name: Install XcodeGen (compatible version)
        run: |
          # Install XcodeGen 2.38.0 which generates project format
          # compatible with Xcode 16.1 (not format 77)
          brew tap xcodegen/xcodegen 2>/dev/null || true
          brew install xcodegen
          xcodegen version

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Downgrade project format if needed
        run: |
          # If XcodeGen generated format 77, downgrade to 56
          OBJVER=$(grep -m1 objectVersion ClaudeFiles.xcodeproj/project.pbxproj | tr -dc '0-9')
          echo "Project format: $OBJVER"
          if [ "$OBJVER" -gt "56" ]; then
            echo "Downgrading from $OBJVER to 56..."
            sed -i '' "s/objectVersion = $OBJVER/objectVersion = 56/" ClaudeFiles.xcodeproj/project.pbxproj
          fi

      - name: Build archive (unsigned)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          xcodebuild archive \
            -project ClaudeFiles.xcodeproj \
            -scheme ClaudeFiles \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/ClaudeFiles.xcarchive" \
            -destination "generic/platform=iOS" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            SKIP_INSTALL=NO 2>&1 | tee /tmp/build.log || {
              SHA=$(curl -s -H "Authorization: token $GH_TOKEN" \
                "https://api.github.com/repos/$GITHUB_REPOSITORY/contents/build-errors.txt" \
                | python3 -c "import sys,json; print(json.load(sys.stdin).get('sha',''))" 2>/dev/null || echo "")
              {
                grep -E "error:|ld:|undefined|Undefined|linker" /tmp/build.log | tail -40
                echo "--- LAST 80 LINES ---"
                tail -80 /tmp/build.log
              } > /tmp/errors_combined.txt
              CONTENT=$(base64 < /tmp/errors_combined.txt | tr -d '\n')
              PAYLOAD="{\"message\":\"build errors\",\"content\":\"$CONTENT\"}"
              [ -n "$SHA" ] && PAYLOAD="{\"message\":\"build errors\",\"content\":\"$CONTENT\",\"sha\":\"$SHA\"}"
              curl -s -X PUT -H "Authorization: token $GH_TOKEN" \
                -H "Content-Type: application/json" \
                "https://api.github.com/repos/$GITHUB_REPOSITORY/contents/build-errors.txt" \
                -d "$PAYLOAD"
              exit 1
            }

      - name: Package IPA
        run: |
          APP_PATH=$(find "$RUNNER_TEMP/ClaudeFiles.xcarchive" -name "*.app" -maxdepth 6 | head -1)
          echo "App at: $APP_PATH"
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -r "$APP_PATH" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP" && zip -r ClaudeFiles-unsigned.ipa Payload/
          echo "IPA_PATH=$RUNNER_TEMP/ClaudeFiles-unsigned.ipa" >> $GITHUB_ENV

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClaudeFiles-unsigned
          path: ${{ env.IPA_PATH }}
          retention-days: 90
