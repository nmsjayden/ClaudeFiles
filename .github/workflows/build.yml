name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Dump project file for debugging
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "=== ls root ===" && ls -la
          echo "=== xcodeproj ===" && ls ClaudeFiles.xcodeproj/ 2>/dev/null || echo "MISSING"
          
          # Commit pbxproj so Claude can inspect it
          if [ -f ClaudeFiles.xcodeproj/project.pbxproj ]; then
            SHA=$(curl -s -H "Authorization: token $GH_TOKEN" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/contents/debug-pbxproj.txt" \
              | python3 -c "import sys,json; print(json.load(sys.stdin).get('sha',''))" 2>/dev/null || echo "")
            CONTENT=$(head -100 ClaudeFiles.xcodeproj/project.pbxproj | base64 | tr -d '\n')
            PAYLOAD="{\"message\":\"debug pbxproj\",\"content\":\"$CONTENT\"}"
            [ -n "$SHA" ] && PAYLOAD="{\"message\":\"debug pbxproj\",\"content\":\"$CONTENT\",\"sha\":\"$SHA\"}"
            curl -s -X PUT -H "Authorization: token $GH_TOKEN" \
              -H "Content-Type: application/json" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/contents/debug-pbxproj.txt" \
              -d "$PAYLOAD"
            echo "Committed pbxproj sample"
          else
            echo "No pbxproj found!"
          fi

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Build archive (unsigned)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          xcodebuild archive \
            -project ClaudeFiles.xcodeproj \
            -scheme ClaudeFiles \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/ClaudeFiles.xcarchive" \
            -destination "generic/platform=iOS" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee /tmp/build.log || {
              SHA=$(curl -s -H "Authorization: token $GH_TOKEN" \
                "https://api.github.com/repos/$GITHUB_REPOSITORY/contents/build-errors.txt" \
                | python3 -c "import sys,json; print(json.load(sys.stdin).get('sha',''))" 2>/dev/null || echo "")
              CONTENT=$(tail -100 /tmp/build.log | base64 | tr -d '\n')
              PAYLOAD="{\"message\":\"build errors\",\"content\":\"$CONTENT\"}"
              [ -n "$SHA" ] && PAYLOAD="{\"message\":\"build errors\",\"content\":\"$CONTENT\",\"sha\":\"$SHA\"}"
              curl -s -X PUT -H "Authorization: token $GH_TOKEN" \
                -H "Content-Type: application/json" \
                "https://api.github.com/repos/$GITHUB_REPOSITORY/contents/build-errors.txt" \
                -d "$PAYLOAD"
              exit 1
            }

      - name: Package IPA
        run: |
          APP_PATH=$(find "$RUNNER_TEMP/ClaudeFiles.xcarchive" -name "*.app" -maxdepth 6 | head -1)
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -r "$APP_PATH" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP" && zip -r ClaudeFiles-unsigned.ipa Payload/
          echo "IPA_PATH=$RUNNER_TEMP/ClaudeFiles-unsigned.ipa" >> $GITHUB_ENV

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClaudeFiles-unsigned
          path: ${{ env.IPA_PATH }}
          retention-days: 30
