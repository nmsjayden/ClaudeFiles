name: ClaudeFiles
options:
  bundleIdPrefix: com.claudefiles
  deploymentTarget:
    iOS: "16.0"

targets:
  ClaudeFiles:
    type: application
    platform: iOS
    sources:
      - path: ClaudeFiles
        excludes:
          - FilzaJailedDS-SSV-Bypass/Tweak.m
          - FilzaJailedDS-SSV-Bypass/FilzaPadlockBypass.m
          - FilzaJailedDS-SSV-Bypass/kexploit/sandbox_backup.m
    settings:
      base:
        SWIFT_VERSION: "5.9"
        PRODUCT_BUNDLE_IDENTIFIER: com.claudefiles.ClaudeFiles
        TARGETED_DEVICE_FAMILY: "1,2"
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        ENABLE_BITCODE: "NO"
        INFOPLIST_FILE: ClaudeFiles/Info.plist
        SWIFT_OBJC_BRIDGING_HEADER: "ClaudeFiles/ClaudeFiles-Bridging-Header.h"
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/ClaudeFiles/FilzaJailedDS-SSV-Bypass"
          - "$(SRCROOT)/ClaudeFiles/FilzaJailedDS-SSV-Bypass/kexploit"
          - "$(SRCROOT)/ClaudeFiles/FilzaJailedDS-SSV-Bypass/kpf"
          - "$(SRCROOT)/ClaudeFiles/FilzaJailedDS-SSV-Bypass/SSV"
          - "$(SRCROOT)/ClaudeFiles/FilzaJailedDS-SSV-Bypass/utils"
          - "$(SRCROOT)/ClaudeFiles/FilzaJailedDS-SSV-Bypass/XPF/src"
          - "$(SRCROOT)/ClaudeFiles/FilzaJailedDS-SSV-Bypass/XPF/external/ChOma/src"
          - "$(SRCROOT)/ClaudeFiles/FilzaJailedDS-SSV-Bypass/XPF/external/ChOma/include"
          - "$(SRCROOT)/ClaudeFiles/FilzaJailedDS-SSV-Bypass/shims"
        OTHER_CFLAGS:
          - "-Wno-unused-variable"
          - "-Wno-shorten-64-to-32"
          - "-Wno-deprecated-declarations"
          - "-Wno-unused-function"
          - "-Wno-format"
          - "-Wno-comma"
          - "-Wno-incompatible-pointer-types-discards-qualifiers"
          - "-Wno-strict-prototypes"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
