name: ClaudeFiles
options:
  bundleIdPrefix: com.claudefiles
  deploymentTarget:
    iOS: "16.0"

targets:
  ClaudeFiles:
    type: application
    platform: iOS
    sources:
      - ClaudeFiles
    settings:
      base:
        SWIFT_VERSION: "5.9"
        PRODUCT_BUNDLE_IDENTIFIER: com.claudefiles.ClaudeFiles
        TARGETED_DEVICE_FAMILY: "1,2"
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        ENABLE_BITCODE: "NO"
        INFOPLIST_FILE: ClaudeFiles/Info.plist
