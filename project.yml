name: ClaudeFiles
options:
  bundleIdPrefix: com.claudefiles
  deploymentTarget:
    iOS: "16.0"

targets:
  ClaudeFiles:
    type: application
    platform: iOS
    sources:
      - path: ClaudeFiles
        excludes:
          # Filza-specific Substrate tweak — replaced by SandboxManager.swift
          - FilzaJailedDS-SSV-Bypass/Tweak.m
          # Uses #import <substrate.h> (Cydia Substrate), won't compile in a normal app
          - FilzaJailedDS-SSV-Bypass/FilzaPadlockBypass.m
          # Backup/research file referencing missing ../research/sandbox_research.h
          - FilzaJailedDS-SSV-Bypass/kexploit/sandbox_backup.m
    settings:
      base:
        SWIFT_VERSION: "5.9"
        PRODUCT_BUNDLE_IDENTIFIER: com.claudefiles.ClaudeFiles
        TARGETED_DEVICE_FAMILY: "1,2"
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        ENABLE_BITCODE: "NO"
        INFOPLIST_FILE: ClaudeFiles/Info.plist
        # Swift ↔ FilzaJailedDS C/ObjC bridge
        SWIFT_OBJC_BRIDGING_HEADER: "ClaudeFiles/ClaudeFiles-Bridging-Header.h"
        # Header search paths for all FilzaJailedDS subdirectories
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/ClaudeFiles/FilzaJailedDS-SSV-Bypass"
          - "$(SRCROOT)/ClaudeFiles/FilzaJailedDS-SSV-Bypass/kexploit"
          - "$(SRCROOT)/ClaudeFiles/FilzaJailedDS-SSV-Bypass/kpf"
          - "$(SRCROOT)/ClaudeFiles/FilzaJailedDS-SSV-Bypass/SSV"
          - "$(SRCROOT)/ClaudeFiles/FilzaJailedDS-SSV-Bypass/utils"
          - "$(SRCROOT)/ClaudeFiles/FilzaJailedDS-SSV-Bypass/XPF/src"
          - "$(SRCROOT)/ClaudeFiles/FilzaJailedDS-SSV-Bypass/XPF/external/ChOma/src"
          - "$(SRCROOT)/ClaudeFiles/FilzaJailedDS-SSV-Bypass/XPF/external/ChOma/include"
        # Suppress C warnings in third-party FilzaJailedDS code
        # (unused vars, 64→32 truncation, deprecated syscall, etc.)
        OTHER_CFLAGS:
          - "-Wno-unused-variable"
          - "-Wno-shorten-64-to-32"
          - "-Wno-deprecated-declarations"
          - "-Wno-unused-function"
          - "-Wno-format"
          - "-Wno-comma"
          - "-Wno-incompatible-pointer-types-discards-qualifiers"
          - "-Wno-strict-prototypes"
        # Xcode 16.4: SwiftUICore.tbd gets pulled in via EagerLinkingTBDs
        # but the linker rejects it ("not an allowed client"). Disabling
        # eager linking stops ld from seeing the tbd at all.
        EAGER_LINKING: "NO"
        MERGED_BINARY_TYPE: ""
        # App icon from asset catalog
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
